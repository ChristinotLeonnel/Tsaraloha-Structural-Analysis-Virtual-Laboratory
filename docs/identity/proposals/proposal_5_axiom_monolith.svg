<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients Direction 5 : Axiom Structural Monolith -->
    <linearGradient id="p5_grad_left" x1="100" y1="120" x2="245" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="p5_grad_right" x1="267" y1="120" x2="412" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>
    <linearGradient id="p5_grad_col" x1="256" y1="210" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="p5_grad_flanks" x1="170" y1="260" x2="340" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>
    <filter id="p5_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0066FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#080D1A"/>

  <g filter="url(#p5_glow)">
    <!-- Barre Supérieure Gauche (Traverse biseautée) -->
    <polygon points="100,140 246,140 246,215 150,215 100,165" fill="url(#p5_grad_left)"/>

    <!-- Barre Supérieure Droite (Traverse biseautée symétrique) -->
    <polygon points="266,140 412,140 412,165 362,215 266,215" fill="url(#p5_grad_right)"/>

    <!-- Piliers angulaires / Consoles de renfort (Efforts de triangulation) -->
    <polygon points="170,230 236,230 236,330 170,264" fill="url(#p5_grad_flanks)" opacity="0.85"/>
    <polygon points="342,230 276,230 276,330 342,264" fill="url(#p5_grad_flanks)" opacity="0.65"/>

    <!-- Fût Vertical Monolithique Central (Colonne de charge pure) -->
    <polygon points="244,195 268,195 278,390 256,420 234,390" fill="url(#p5_grad_col)"/>

    <!-- Fente de lumière centrale au sommet (Précision optique / Nodal point) -->
    <circle cx="256" cy="140" r="4" fill="#FFFFFF"/>
  </g>
</svg>
