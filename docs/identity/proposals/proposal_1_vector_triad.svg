<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients Direction 1 : T-Vector Triad -->
    <linearGradient id="grad_left_wing" x1="80" y1="120" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="grad_right_wing" x1="262" y1="120" x2="432" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="grad_stem" x1="256" y1="230" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="60%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <!-- Ombre subtile sous le nœud -->
    <filter id="node_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0052D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond sombre optionnel pour la prévisualisation (supprimé dans la version transparente) -->
  <rect width="512" height="512" rx="112" fill="#0A0F1D"/>

  <g filter="url(#node_glow)">
    <!-- Aile gauche (Traverse gauche du T biseautée - Vecteur X) -->
    <!-- Coordonnées précises formant un prisme dynamique -->
    <polygon points="84,140 244,140 244,228 140,228 84,188" fill="url(#grad_left_wing)"/>

    <!-- Aile droite (Traverse droite du T biseautée - Vecteur Y) -->
    <polygon points="268,140 428,140 428,188 372,228 268,228" fill="url(#grad_right_wing)"/>

    <!-- Fût central (Pied vertical du T - Vecteur Z / Stabilité) -->
    <!-- S'évase légèrement vers le haut avec une tête biseautée et descend vers une pointe biseautée -->
    <polygon points="214,248 298,248 280,416 232,416" fill="url(#grad_stem)"/>

    <!-- Nœud central subtil : Point nodal de focalisation (losange lumineux blanc cyan) -->
    <polygon points="256,218 266,233 256,248 246,233" fill="#E0F7FA" opacity="0.95"/>
  </g>
</svg>
