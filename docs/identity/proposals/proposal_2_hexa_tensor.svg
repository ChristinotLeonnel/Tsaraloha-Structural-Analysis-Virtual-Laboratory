<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients Direction 2 : Hexa-Tensor -->
    <linearGradient id="p2_grad_top" x1="160" y1="80" x2="350" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="p2_grad_left" x1="90" y1="200" x2="250" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="p2_grad_right" x1="260" y1="200" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="p2_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0072FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond sombre pour mise en valeur -->
  <rect width="512" height="512" rx="112" fill="#0A0F1D"/>

  <g filter="url(#p2_glow)">
    <!-- Facette Supérieure (Traverse horizontale / Toit isométrique en T) -->
    <!-- Forme prismatique diamantée avec encoche centrale négative -->
    <polygon points="256,92 400,175 350,204 256,150 162,204 112,175" fill="url(#p2_grad_top)"/>

    <!-- Facette Basse Gauche (Pilier / Flanc de cisaillement) -->
    <polygon points="102,198 152,227 152,336 244,389 244,420 102,338" fill="url(#p2_grad_left)"/>

    <!-- Facette Basse Droite (Pilier symétrique droit) -->
    <polygon points="410,198 410,338 268,420 268,389 360,336 360,227" fill="url(#p2_grad_right)"/>

    <!-- Noyau Central flottant : Le Nœud Monolithique (Tenseur central) -->
    <!-- Un T stylisé en 3D qui flotte au centre exact du vide géométrique -->
    <polygon points="220,188 292,188 292,216 270,216 270,330 242,330 242,216 220,216" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
