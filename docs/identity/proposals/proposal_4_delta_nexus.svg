<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients Direction 4 : Delta Vector / Dynamic Tech -->
    <linearGradient id="p4_grad_top" x1="100" y1="110" x2="420" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>
    <linearGradient id="p4_grad_bot" x1="180" y1="230" x2="330" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <filter id="p4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0066FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#070B19"/>

  <g filter="url(#p4_glow)">
    <!-- Aile supérieure dynamique (Le toit vectoriel du T) -->
    <!-- Forme un chevron aérodynamique à 30° d'inclinaison avec découpe interne franche -->
    <polygon points="96,172 256,108 416,172 376,220 256,172 136,220" fill="url(#p4_grad_top)"/>

    <!-- Flèche / Tige verticale dynamique (Le fût du T) -->
    <!-- Un trapèze vertical acéré taillé en diamant avec coupe diagonale au sommet -->
    <polygon points="228,198 284,198 304,396 210,396" fill="url(#p4_grad_bot)"/>

    <!-- Deuxième aileron d'équilibrage latéral (Force de rappel élastique) -->
    <polygon points="236,412 276,412 256,436" fill="#00F5D4"/>
  </g>
</svg>
