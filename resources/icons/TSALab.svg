<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TSALab : fond squircle commun à l'écosystème Tsaraloha ; symbole propre au laboratoire :
       une fiole d'essai dont le liquide est un treillis (expérimentation structurale). -->
  <defs>
    <linearGradient id="lab_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E162A"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="lab_glass" x1="120" y1="96" x2="392" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18F0D8"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="lab_liquid" x1="120" y1="320" x2="392" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14D8C4"/>
      <stop offset="100%" stop-color="#6A3DF0"/>
    </linearGradient>
    <filter id="lab_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C4DFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#lab_bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <g filter="url(#lab_glow)">
    <!-- Liquide : treillis de Warren -->
    <polygon points="161,320 351,320 392,408 120,408" fill="url(#lab_liquid)"/>
    <polyline points="170,330 213,400 256,330 299,400 342,330" stroke="#0A1020" stroke-width="12"
              stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <!-- Verre de la fiole -->
    <polyline points="216,104 216,200 120,408 392,408 296,200 296,104" stroke="url(#lab_glass)" stroke-width="26"
              stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <line x1="190" y1="100" x2="322" y2="100" stroke="url(#lab_glass)" stroke-width="26" stroke-linecap="round"/>
    <!-- Nœuds structuraux -->
    <circle cx="216" cy="200" r="15" fill="#FFFFFF"/>
    <circle cx="296" cy="200" r="15" fill="#FFFFFF"/>
    <circle cx="120" cy="408" r="15" fill="#FFFFFF"/>
    <circle cx="392" cy="408" r="15" fill="#FFFFFF"/>
    <!-- Bulles -->
    <circle cx="246" cy="282" r="9" fill="#18F0D8"/>
    <circle cx="272" cy="252" r="6" fill="#18F0D8" fill-opacity="0.8"/>
  </g>
</svg>
