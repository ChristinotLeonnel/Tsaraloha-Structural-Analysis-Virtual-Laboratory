<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card_shadow" x="70" y="24" width="372" height="472" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="doc_grad" x1="112" y1="48" x2="400" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="badge_grad" x1="156" y1="364" x2="356" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Forme du document avec coin plié -->
  <g filter="url(#card_shadow)">
    <path d="M128 48H304L400 144V448C400 456.837 392.837 464 384 464H128C119.163 464 112 456.837 112 448V64C112 55.1634 119.163 48 128 48Z" fill="url(#doc_grad)" stroke="#CBD5E1" stroke-width="6" stroke-linejoin="round"/>
    <path d="M304 48V144H400" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Logo officiel T dans le style Hazel au centre du document -->
  <g transform="translate(136, 120) scale(0.46875)" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="138,72.5 188,72.5 104,148.5 54,148.5" fill="#D3D7DA" stroke="#000000" stroke-width="12"/>
    <polygon points="218,72.5 458,72.5 374,148.5 322,148.5 322,292.5 246,361.5 246,148.5 134,148.5" fill="#D3D7DA" stroke="#000000" stroke-width="12"/>
    <polygon points="322,320.5 322,370.5 246,439.5 246,389.5" fill="#D3D7DA" stroke="#000000" stroke-width="12"/>
  </g>

  <!-- Badge d'extension .TSA -->
  <rect x="156" y="372" width="200" height="60" rx="14" fill="url(#badge_grad)"/>
  <rect x="157" y="373" width="198" height="58" rx="13" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>
  <text x="256" y="415" font-family="'Segoe UI', -apple-system, sans-serif" font-size="30" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="4">.TSA</text>
